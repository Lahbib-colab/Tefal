button,[role=button]{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
svg{display:block}
/* mise en page */
.wrap{padding:6px 20px 220px;max-width:560px;margin:0 auto}
.hd{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin:6px 0 20px}
.hd h1{font-size:34px;font-weight:700;letter-spacing:-.026em;line-height:1.1;margin:0}
.hd p{margin:4px 0 0;color:var(--mu);font-size:15px}
.hb{display:flex;gap:8px;flex:none;margin-top:3px}
.ib{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--glass);border:.5px solid var(--glass-b);-webkit-backdrop-filter:blur(var(--blur)) saturate(180%);backdrop-filter:blur(var(--blur)) saturate(180%);box-shadow:inset 0 .5px 0 rgba(255,255,255,.16),0 2px 10px rgba(0,0,0,.2)}
.ib svg{width:20px;height:20px;fill:var(--tx)}
.ib.inst svg{fill:var(--gr)}
.sh2{font-size:13px;font-weight:600;color:var(--mu);margin:26px 6px 8px}
.grp{background:var(--card);-webkit-backdrop-filter:blur(var(--blur)) saturate(170%);backdrop-filter:blur(var(--blur)) saturate(170%);border-radius:var(--r);box-shadow:inset 0 0 0 .5px var(--card-b),inset 0 1px 0 rgba(255,255,255,.07);overflow:hidden}
.grp.pad{padding:18px 16px}
.sub{color:var(--mu);font-size:14px;margin:0}
.note{color:var(--mu);font-size:13px;line-height:1.45;margin:16px 6px 0}
.tip{margin:16px 6px 0;font-size:14px;line-height:1.45;color:var(--mu)}
.tip b{color:var(--tx);font-weight:600}
.lbl{font-size:13px;font-weight:500;color:var(--mu)}
.v{font-size:32px;font-weight:700;letter-spacing:-.03em;line-height:1.1;font-variant-numeric:tabular-nums}
.v small{font-size:15px;font-weight:600;margin-left:3px;letter-spacing:0}
.heatc{color:var(--heat)}.grc{color:var(--gr)}
.s-ok{color:var(--ok)}.s-mid{color:var(--mid)}.s-bad{color:var(--bad)}
/* boutons */
.go{width:100%;height:54px;border-radius:27px;display:flex;align-items:center;justify-content:center;gap:10px;padding:0 18px;text-align:center;font-size:17px;font-weight:700;letter-spacing:-.012em;color:var(--ongr);background:linear-gradient(180deg,color-mix(in srgb,var(--gr) 80%,#fff),var(--gr));box-shadow:inset 0 1px 0 rgba(255,255,255,.4),0 8px 24px color-mix(in srgb,var(--gr) 28%,transparent)}
.go svg{width:20px;height:20px;fill:currentColor;flex:none}
.sec{min-height:48px;border-radius:24px;display:flex;align-items:center;justify-content:center;gap:8px;padding:0 16px;text-align:center;font-weight:600;font-size:15px;background:var(--seg);border:.5px solid var(--glass-b)}
.sec svg{width:18px;height:18px;fill:currentColor;flex:none}
.sec.sm{min-height:38px;font-size:14px}
.sec.danger{background:var(--bad);color:#fff;border-color:transparent}
.txt{font-size:16px;font-weight:600;color:var(--gr);padding:12px 8px;width:100%;text-align:center}
.txt.red{color:var(--bad)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.row3 .sec{padding:0 6px;white-space:nowrap;font-size:14px;gap:6px}
.frow{display:grid;grid-template-columns:1fr 56px;gap:10px}
.ib2{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;background:var(--seg);border:.5px solid var(--glass-b)}
.ib2 svg{width:20px;height:20px;fill:var(--tx)}
.go,.sec,.rw,.runcard{transition:transform .12s ease}
.go:active,.sec:active,.rw:active,.runcard:active{transform:scale(.98)}
.seg{display:flex;background:var(--seg);border-radius:14px;padding:3px;margin-bottom:18px}
.seg button{flex:1;height:34px;border-radius:11px;font-weight:600;font-size:14px;color:var(--mu);transition:background .2s,color .2s}
.seg button.on{background:var(--seg-on);color:var(--tx);box-shadow:0 2px 6px rgba(0,0,0,.25)}
.pre{display:flex;gap:8px;flex-wrap:wrap}
.pre.c{justify-content:center}
.pre.scroll{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin:14px -20px 20px;padding:0 20px}
.pre.scroll::-webkit-scrollbar{display:none}
.pre.between{justify-content:space-between;flex-wrap:nowrap}
.pre button{flex:none;height:34px;padding:0 14px;border-radius:17px;background:var(--seg);font-weight:600;font-size:14px;white-space:nowrap}
.pre button.on{background:var(--gr);color:var(--ongr)}
.stp{display:flex;align-items:center;justify-content:space-between;background:var(--seg);border-radius:22px;padding:3px;height:46px}
.stp button{width:42px;height:40px;border-radius:19px;display:grid;place-items:center}
.stp button:active{background:var(--seg)}
.stp svg{width:18px;height:18px;fill:var(--tx)}
.stp span{font-weight:600;font-size:15px;white-space:nowrap;padding:0 6px}
.stp.c{width:122px;margin:10px auto 0}
.stp2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.rbtn{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--seg);flex:none}
.rbtn svg{width:20px;height:20px;fill:var(--tx)}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:30px;background:transparent;margin:14px 0 8px}
input[type=range]::-webkit-slider-runnable-track{height:6px;border-radius:3px;background:linear-gradient(to right,var(--gr) var(--p,30%),var(--seg) var(--p,30%))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:28px;height:28px;margin-top:-11px;border-radius:50%;background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.4),0 0 0 .5px rgba(0,0,0,.12)}
/* liste du guide */
.rw{position:relative;display:flex;align-items:center;gap:14px;padding:12px 16px 12px 14px;cursor:pointer}
.rw+.rw::before{content:'';position:absolute;top:0;left:80px;right:0;height:.5px;background:var(--sep)}
.rw .ico{width:52px;height:52px;border-radius:15px;display:grid;place-items:center;flex:none;background:color-mix(in srgb,var(--c) 18%,var(--s2))}
.rw .rb{flex:1;min-width:0}
.rw .rb b{display:block;font-size:17px;font-weight:600;letter-spacing:-.02em;line-height:1.25}
.rw .cap{display:block;font-size:13px;color:var(--mu);margin-top:1px}
.rw .ln{display:flex;gap:8px;margin-top:4px;font-size:14px;color:var(--mu);font-variant-numeric:tabular-nums}
.rw .ln i{font-style:normal;min-width:42px}
.rw .ln .t{color:var(--heat);font-weight:600}
.rw .ln span+span::before{content:'·';margin-right:8px;color:var(--mu2)}
.rw>svg{fill:var(--mu2);flex:none}
.runcard{display:flex;align-items:center;gap:12px;padding:10px 16px 10px 10px;margin-bottom:18px;cursor:pointer;background:var(--card);-webkit-backdrop-filter:blur(var(--blur)) saturate(170%);backdrop-filter:blur(var(--blur)) saturate(170%);border-radius:var(--r2);box-shadow:inset 0 0 0 .5px var(--card-b)}
.runcard .mi{width:46px;height:46px;border-radius:13px;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 18%,var(--s2))}
.runcard .tx{flex:1;min-width:0}.runcard .tx b{display:block;font-size:16px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.runcard .tx span{color:var(--mu);font-size:13px}
.runcard .tm{font-size:22px;font-weight:700;color:var(--gr);font-variant-numeric:tabular-nums}
/* lignes de réglages */
.lr{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:52px;padding:8px 16px;font-size:16px}
.lr+.lr{border-top:.5px solid var(--sep)}
.lr>span{color:var(--tx)}
.lr>b{font-weight:500;color:var(--mu)}
.lr .stp{width:124px;height:38px}.lr .stp button{height:32px;width:36px}
.lr.act{justify-content:center;color:var(--gr);font-weight:600;width:100%}
.lr.act.red{color:var(--bad)}
/* barre d'onglets */
nav{position:fixed;left:14px;right:14px;bottom:calc(10px + env(safe-area-inset-bottom,0px));max-width:520px;margin:0 auto;z-index:10;display:flex;padding:6px;border:.5px solid var(--glass-b);border-radius:36px;background:var(--glass);-webkit-backdrop-filter:blur(var(--blur)) saturate(190%);backdrop-filter:blur(var(--blur)) saturate(190%);box-shadow:inset 0 .5px 0 rgba(255,255,255,.22),var(--shadow)}
nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 0 6px;border-radius:30px;font-size:11px;font-weight:600;letter-spacing:.01em;color:var(--mu);position:relative;transition:background .25s ease,color .25s ease}
nav button svg{width:24px;height:24px;fill:currentColor}
nav button.on{background:color-mix(in srgb,var(--tx) 11%,transparent);color:var(--gr)}
nav .dot{position:absolute;top:4px;left:calc(50% + 6px);width:9px;height:9px;border-radius:50%;background:var(--bad);border:2px solid var(--s1)}
.mini{position:fixed;left:14px;right:14px;bottom:calc(84px + env(safe-area-inset-bottom,0px));max-width:520px;margin:0 auto;z-index:20;display:flex;align-items:center;gap:12px;padding:8px 16px 8px 8px;border:.5px solid var(--glass-b);border-radius:26px;background:var(--glass);-webkit-backdrop-filter:blur(var(--blur)) saturate(190%);backdrop-filter:blur(var(--blur)) saturate(190%);box-shadow:inset 0 .5px 0 rgba(255,255,255,.2),var(--shadow);cursor:pointer}
.mini .mi{width:44px;height:44px;border-radius:13px;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 20%,var(--s2));flex:none}
.mini .tx{flex:1;min-width:0}
.mini .tx b{display:block;font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini .tx span{font-size:13px;color:var(--heat);font-weight:600}
.mini .tm{font-size:21px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--gr)}
.mini.dn{background:var(--heat);border-color:transparent;color:#1d0d00}
.mini.dn .tx span,.mini.dn .tm{color:#1d0d00}
/* feuilles et fenêtres */
#modal{position:fixed;inset:0;display:flex;flex-direction:column}
#sheet{position:fixed;top:calc(env(safe-area-inset-top,0px) + 10px);left:0;right:0;bottom:0;z-index:30;display:flex;flex-direction:column;border-radius:38px 38px 0 0;background:var(--sheet);-webkit-backdrop-filter:blur(calc(var(--blur)*1.4)) saturate(170%);backdrop-filter:blur(calc(var(--blur)*1.4)) saturate(170%);box-shadow:inset 0 .5px 0 var(--glass-b),0 -10px 40px rgba(0,0,0,.35)}
#modal{z-index:40;background:rgba(0,0,0,.5);justify-content:flex-end}
#sheet[hidden],#modal[hidden],#toast[hidden]{display:none}
.mdl{position:relative;background:var(--s1);border-radius:34px 34px 0 0;padding:26px 22px calc(22px + env(safe-area-inset-bottom,0px));max-height:80%;overflow:auto}
.mdl::before{content:'';position:absolute;top:8px;left:50%;width:38px;height:5px;margin-left:-19px;border-radius:3px;background:var(--s3)}
.mdl h2{margin:0 0 8px;font-size:22px;letter-spacing:-.02em}
.mdl p{color:var(--mu);margin:6px 0}
.mdl ol{padding-left:20px;margin:8px 0 18px}
.sbar{position:relative;display:flex;align-items:center;justify-content:space-between;padding:22px 16px 6px;touch-action:none}
.sbar::before{content:'';position:absolute;top:7px;left:50%;width:36px;height:5px;margin-left:-18px;border-radius:3px;background:var(--mu2)}
.sbar .st{flex:1;min-width:0;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 10px;font-weight:600;font-size:17px;letter-spacing:-.02em}
.sbody{flex:1;overflow-y:auto;padding:4px 20px 56px;-webkit-overflow-scrolling:touch}
.sbody h1{font-size:28px;font-weight:700;letter-spacing:-.026em;margin:14px 0 2px;line-height:1.15}
.sfoot{margin-top:-40px;padding:44px 20px calc(14px + env(safe-area-inset-bottom,0px));background:linear-gradient(to top,color-mix(in srgb,var(--bg) 82%,transparent) 58%,transparent);display:grid;gap:10px;pointer-events:none}
.sfoot>*{pointer-events:auto}
.sfoot .sub{text-align:center}
.qty{padding:20px 18px 16px}
.qty .stepr{display:flex;align-items:center;justify-content:space-between;text-align:center}
.qty .big{font-size:52px;font-weight:700;letter-spacing:-.04em;line-height:1;font-variant-numeric:tabular-nums}
.qty .big small{font-size:20px;font-weight:600;color:var(--mu);margin-left:4px;letter-spacing:0}
.qty .cap{font-size:13px;color:var(--mu);margin-top:6px}
.qty .pre{justify-content:space-between;flex-wrap:nowrap}
.stg{margin-top:12px}
.stg .sgh{display:flex;justify-content:space-between;align-items:baseline;gap:8px;padding:14px 16px 0;flex-wrap:wrap}
.stg .sgh b{font-size:17px;font-weight:600}
.stg .sgh span{font-size:13px;color:var(--mu)}
.stg .sgb{display:grid;grid-template-columns:1fr 1fr;padding:10px 0 14px}
.stg .sgb>div{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:2px 10px;gap:2px}
.stg .sgb>div+div{border-left:.5px solid var(--sep)}
.stg .sgb .v{font-size:30px}
.stg .out{color:var(--mid);font-size:12px;font-weight:600;text-align:center;padding:0 16px 12px}
.mk{width:84px;margin:6px auto 2px}.mk svg{width:100%;height:auto;display:block}
.warn{margin-top:12px;background:color-mix(in srgb,var(--bad) 14%,transparent);border-radius:20px;padding:14px 16px;display:grid;gap:8px;justify-items:start}
.warn b{color:var(--bad)}.warn span{font-size:14px}
.info{margin-top:12px;background:color-mix(in srgb,var(--mid) 14%,transparent);border-radius:18px;padding:12px 14px;font-size:14px}
/* anneau (minuteur libre) */
.ring{position:relative;width:min(74vw,290px);aspect-ratio:1;margin:14px auto}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:14}
.ring .tr{stroke:var(--s2)}
.ring .pg{stroke:var(--gr);stroke-linecap:round;transition:stroke-dashoffset .3s linear}
.ring.dn .pg{stroke:var(--heat)}
.rc{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;text-align:center;padding:0 24px}
.rc .big{font-size:58px;font-weight:700;letter-spacing:-.03em;font-variant-numeric:tabular-nums;line-height:1}
.rc .sm{color:var(--mu);font-size:14px;font-weight:600}
.stgb{display:inline-block;font-weight:600;font-size:13px;padding:4px 12px;border-radius:14px;background:var(--seg);color:var(--mu)}
/* huile */
.oil{padding:8px 16px 18px;text-align:center}
.oil .dial{margin:0 auto 10px;background:transparent;box-shadow:none;-webkit-backdrop-filter:none;backdrop-filter:none}
.oil .ost b{display:block;font-size:20px;font-weight:700;letter-spacing:-.02em}
.oil .ost span{display:block;color:var(--mu);font-size:14px;margin-top:2px}
.cells{display:flex;gap:5px;margin:16px 0}
.cells span{flex:1;height:8px;border-radius:4px;background:var(--seg)}
.cells span.f.ok{background:var(--ok)}.cells span.f.mid{background:var(--mid)}.cells span.f.bad{background:var(--bad)}
.bigt{text-align:center;font-size:48px;font-weight:700;letter-spacing:-.03em;font-variant-numeric:tabular-nums;line-height:1.1;margin:4px 0 10px}
.bar{height:6px;border-radius:3px;background:var(--seg);overflow:hidden;margin:6px 0 10px}
.bar i{display:block;height:100%;background:var(--gr);border-radius:3px;transition:width .5s linear}
.due{background:var(--heat);color:#1d0d00;border-radius:20px;padding:16px;display:grid;gap:10px;margin-bottom:8px}
.due b{font-size:18px}
.laps .lr{font-variant-numeric:tabular-nums}
.empty{color:var(--mu);text-align:center;padding:18px 0;font-size:14px}
#toast{position:fixed;left:14px;right:14px;bottom:calc(86px + env(safe-area-inset-bottom,0px));max-width:520px;margin:0 auto;z-index:50;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 18px;font-weight:600;font-size:14px;color:var(--tx);background:var(--glass);border:.5px solid var(--glass-b);border-radius:22px;-webkit-backdrop-filter:blur(var(--blur)) saturate(190%);backdrop-filter:blur(var(--blur)) saturate(190%);box-shadow:var(--shadow)}
#toast button{font-weight:700;color:var(--gr)}
.dials{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:4px 0 14px}
.dials svg,.runrow svg{width:100%;height:auto;display:block}
.kn{transform-origin:100px 100px;transition:transform 1.6s cubic-bezier(.3,.7,.2,1)}
.led.on{animation:blink 1s ease-in-out infinite}
.ledg.on{animation:blink 1s ease-in-out infinite}
.act.hot{filter:drop-shadow(0 0 4px #ff9f4a)}
.elem .hot{opacity:0;transition:opacity 1.2s ease}
.elem.on .hot{opacity:1;animation:glow 1.7s ease-in-out infinite;filter:drop-shadow(0 0 6px #ff3a1d)}
@keyframes blink{50%{opacity:.3}}
@keyframes glow{50%{opacity:.7}}
.heatst{display:flex;align-items:center;justify-content:center;gap:10px;font-weight:800;font-size:22px;color:var(--heat)}
.heatst b{font-variant-numeric:tabular-nums;color:var(--tx)}
.hl{width:12px;height:12px;border-radius:50%;background:#ff3030;box-shadow:0 0 10px #ff3030;animation:blink 1s ease-in-out infinite}
.runrow{display:grid;grid-template-columns:120px 1fr;gap:12px;align-items:center}
.mk{width:92px;margin:6px auto 0}.mk svg{width:100%;height:auto;display:block}
#sheet{overflow:hidden}
#sheet>*{position:relative;z-index:1}
#sheet.in{animation:sin .5s cubic-bezier(.32,.72,0,1)}
@keyframes sin{from{transform:translateY(100%)}}
.dial{width:min(84vw,300px);margin:10px auto 0;aspect-ratio:1;border-radius:17%;background:var(--card);-webkit-backdrop-filter:blur(var(--blur)) saturate(170%);backdrop-filter:blur(var(--blur)) saturate(170%);box-shadow:inset 0 0 0 .5px var(--card-b),inset 0 1px 0 rgba(255,255,255,.08)}
.dial.lg{width:min(76vw,290px);margin:4px auto 0}
.dial svg{width:100%;height:auto;display:block}
.dial.big{width:min(100%,360px);margin:8px auto 0}
.dial.drag{position:relative}
.grab{position:absolute;left:50%;top:50%;width:56%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;touch-action:none;cursor:grab;-webkit-tap-highlight-color:transparent}
.grab:active{cursor:grabbing}
.grab:focus-visible{outline:2px solid var(--gr);outline-offset:-2px}
.adj{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.adj .lbl{text-align:center;margin-bottom:6px}
.adj .stp span{font-variant-numeric:tabular-nums}
.spin{transform-origin:100px 100px;animation:spin 2.6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.kn0{transform-origin:100px 100px}
.tprog{transition:stroke-dashoffset .3s linear}
@media (prefers-reduced-motion:reduce){.ring .pg,.bar i,.kn,.tprog,.go,.sec,.rw{transition:none}.led.on,.ledg.on,.hl,.spin{animation:none!important}}

.phead{display:flex;align-items:center;gap:14px;margin:6px 0 18px}
.phead .ico{width:64px;height:64px;border-radius:19px;display:grid;place-items:center;flex:none;background:color-mix(in srgb,var(--c) 22%,transparent);box-shadow:inset 0 0 0 .5px var(--card-b)}
.phead h1{margin:0}
#main{transform-origin:50% 0;transition:transform .5s cubic-bezier(.32,.72,0,1)}
body.so #main{transform:scale(.94) translateY(8px)}
#scrim{position:fixed;inset:0;z-index:29;background:rgba(0,0,0,.35);opacity:0;pointer-events:none;transition:opacity .4s ease}
body.so #scrim{opacity:1;pointer-events:auto}
#edge{position:fixed;left:0;top:0;bottom:0;width:20px;z-index:35;touch-action:none;display:none}
body.so #edge{display:block}
#cbar{position:fixed;top:0;left:0;right:0;z-index:9;height:calc(env(safe-area-inset-top,0px) + 44px);padding-top:env(safe-area-inset-top,0px);display:flex;align-items:center;justify-content:center;font-weight:600;font-size:17px;letter-spacing:-.02em;background:var(--glass);-webkit-backdrop-filter:blur(var(--blur)) saturate(180%);backdrop-filter:blur(var(--blur)) saturate(180%);border-bottom:.5px solid var(--glass-b);opacity:0;transition:opacity .25s ease;pointer-events:none}
body.sc #cbar{opacity:1}
body.hm .wrap{padding-bottom:300px}
.wrap,.sbody{zoom:var(--dt,1)}
/* fond dynamique */
@property --o1{syntax:'<color>';inherits:true;initial-value:rgba(48,209,88,.20)}
@property --o2{syntax:'<color>';inherits:true;initial-value:rgba(10,132,255,.16)}
@property --o3{syntax:'<color>';inherits:true;initial-value:rgba(255,159,10,.10)}
body{--o1:rgb(var(--acrgb)/.30);--o2:rgba(10,132,255,.22);--o3:rgba(255,159,10,.14);transition:--o1 1.6s ease,--o2 1.6s ease,--o3 1.6s ease}
body[data-tab="timer"]{--o1:rgba(10,132,255,.34);--o2:rgba(94,92,230,.24);--o3:rgba(48,209,88,.12)}
body[data-tab="oil"]{--o1:rgba(255,159,10,.32);--o2:rgba(255,214,10,.18);--o3:rgba(48,209,88,.14)}
body[data-ph="prep"]{--o1:color-mix(in srgb,var(--hot) 24%,transparent);--o2:rgba(255,214,10,.12);--o3:rgba(48,209,88,.10)}
body[data-ph="heat"]{--o1:color-mix(in srgb,var(--hot) 34%,transparent);--o2:rgba(255,69,58,.16);--o3:color-mix(in srgb,var(--hot) 18%,transparent)}
body[data-ph="run"]{--o1:color-mix(in srgb,var(--hot) 28%,transparent);--o2:rgba(255,214,10,.14);--o3:rgba(255,120,30,.12)}
body[data-ph="done"]{--o1:rgba(48,209,88,.36);--o2:rgba(10,132,255,.20);--o3:rgba(48,209,88,.16)}
#bg{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none}
#bg i{position:absolute;display:block;width:80vmax;height:80vmax;border-radius:50%;will-change:transform}
#bg i:nth-child(1){left:-38vmax;top:-40vmax;background:radial-gradient(circle,var(--o1) 0,transparent 62%);animation:dr1 24s ease-in-out infinite alternate}
#bg i:nth-child(2){right:-48vmax;top:8vh;background:radial-gradient(circle,var(--o2) 0,transparent 62%);animation:dr2 31s ease-in-out infinite alternate}
#bg i:nth-child(3){left:-20vmax;bottom:-58vmax;background:radial-gradient(circle,var(--o3) 0,transparent 62%);animation:dr3 27s ease-in-out infinite alternate}
@keyframes dr1{to{transform:translate(22vmax,26vmax) scale(1.18)}}
@keyframes dr2{to{transform:translate(-26vmax,18vmax) scale(.9)}}
@keyframes dr3{to{transform:translate(30vmax,-20vmax) scale(1.2)}}
body.hid #bg i{animation-play-state:paused}
body.nobg #bg i{animation:none}
@keyframes bgp{50%{opacity:.62}}
@media (prefers-reduced-motion:reduce){#bg i,#bg{animation:none!important}body{transition:none}}
/* thèmes, réglages, pictos */
.thm{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.thm button{display:flex;flex-direction:column;align-items:center;gap:7px;font-size:11.5px;min-width:0;font-weight:600;color:var(--mu)}
.thm button.on{color:var(--tx)}
.thm .pv{width:100%;aspect-ratio:3/4;border-radius:14px;padding:8px 6px;display:flex;flex-direction:column;gap:4px;justify-content:flex-end;box-shadow:inset 0 0 0 1px rgba(128,128,128,.4)}
.thm .pv b{display:block;height:5px;width:55%;border-radius:3px;margin-bottom:2px;opacity:.85}
.thm .pv i{display:block;height:9px;border-radius:4px}
.thm button.on .pv{box-shadow:0 0 0 2.5px var(--gr)}
.acc{display:flex;gap:10px;justify-content:space-between;padding:0 4px}
.acc button{position:relative;width:40px;height:40px;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(255,255,255,.2)}
.acc button.on::after{content:'';position:absolute;inset:-5px;border-radius:50%;border:2.5px solid var(--tx)}
.sw{position:relative;flex:none;width:51px;height:31px;border-radius:16px;background:var(--seg);transition:background .25s ease}
.sw::after{content:'';position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.35);transition:transform .25s cubic-bezier(.32,.72,0,1)}
.sw[aria-checked="true"]{background:var(--gr)}
.sw[aria-checked="true"]::after{transform:translateX(20px)}
.lr small{display:block;color:var(--mu);font-size:13px;margin-top:1px;line-height:1.35}
.lr>div:first-child{min-width:0}
.lnk{font-weight:600;color:var(--gr);font-size:16px}
.tips p{margin:0 0 10px;color:var(--mu);font-size:14px;line-height:1.45;padding-left:18px;position:relative}
.tips p:last-child{margin:0}
.tips p::before{content:'';position:absolute;left:2px;top:.6em;width:6px;height:6px;border-radius:50%;background:var(--gr)}
.ta{width:100%;min-height:150px;border:0;border-radius:16px;background:var(--seg);color:var(--tx);padding:12px;font:12px/1.4 ui-monospace,SFMono-Regular,Menlo,monospace;resize:none;margin-top:6px}
.rcn{display:flex;gap:10px;overflow-x:auto;margin:0 -20px 4px;padding:0 20px 4px;scrollbar-width:none}
.rcn::-webkit-scrollbar{display:none}
.rcc{flex:none;width:196px;display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:20px;background:var(--card);-webkit-backdrop-filter:blur(var(--blur)) saturate(170%);backdrop-filter:blur(var(--blur)) saturate(170%);box-shadow:inset 0 0 0 .5px var(--card-b);text-align:left}
.rcc .ico{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;flex:none;background:linear-gradient(145deg,color-mix(in srgb,var(--c) 34%,transparent),color-mix(in srgb,var(--c) 12%,transparent))}
.rcc b{display:block;font-size:14px;font-weight:600;letter-spacing:-.015em;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rcc span{display:block;font-size:12.5px;color:var(--mu);margin-top:1px}
.rcc>div:last-child{min-width:0}
.rw .ico{position:relative;width:56px;height:56px;border-radius:17px;background:linear-gradient(145deg,color-mix(in srgb,var(--c) 34%,transparent),color-mix(in srgb,var(--c) 12%,transparent));box-shadow:inset 0 0 0 .5px var(--card-b)}
.rw+.rw::before{left:84px}
.bdg{position:absolute;right:-4px;bottom:-4px;width:20px;height:20px;border-radius:50%;display:grid;place-items:center;background:#4DA3FF;box-shadow:0 0 0 2px var(--s1)}
.bdg svg{fill:none;stroke:#fff;stroke-width:2.2;stroke-linecap:round}
/* pas de sélection ni de zoom */
html{touch-action:manipulation}
*{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
input,textarea,.ta{-webkit-user-select:text;user-select:text;-webkit-touch-callout:default}
.ta{font-size:16px}
img,svg{-webkit-user-drag:none;user-drag:none}

let AC=null,alarmI=null,WL=null;
function unlock(){try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume()}catch(e){}}
function ding(){
  if(!AC||!PF.sound)return;
  try{
    const t=AC.currentTime,m=AC.createGain();m.gain.value=.9*PF.vol;m.connect(AC.destination);
    [[1,1,2.4],[2.76,.32,1.3],[5.4,.16,.7],[8.93,.07,.4]].forEach(([r,a,d])=>{
      const o=AC.createOscillator(),g=AC.createGain();o.type='sine';o.frequency.value=1174.66*r;
      g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(a,t+.004);g.gain.exponentialRampToValueAtTime(.0001,t+d);
      o.connect(g);g.connect(m);o.start(t);o.stop(t+d+.05);
    });
  }catch(e){}
}
const vib=()=>{try{if(PF.vib&&navigator.vibrate)navigator.vibrate([300,150,300])}catch(e){}};
function alarmOn(){alarmOff();ding();vib();alarmI=setInterval(()=>{ding();vib()},5000)}

    const reg=SWREG||(navigator.serviceWorker&&await navigator.serviceWorker.getRegistration());

  }catch(e){}
}

function remaining(){if(!T)return 0;if(T.paused||T.phase!=='run')return T.rem;return Math.max(0,(T.end-Date.now())/1000)}
function beginStage(){const st=T.stages[T.i];T.total=st.sec;T.rem=st.sec;T.end=Date.now()+st.sec*1000;T.paused=false;T.phase='run'}
function startT(o){
  unlock();alarmOff();
  T=Object.assign({i:0,counted:false},o);
  if(T.stages[0].temp){T.total=T.stages[0].sec;T.rem=T.total;T.phase='heat';T.heatStart=Date.now()}else beginStage();
  saveT();wake();askNotif();
  S.sheet='cook';renderSheet();renderMain();renderNav();
}
function stageEnd(){
  const last=T.i>=T.stages.length-1,cur=T.stages[T.i];
  T.rem=0;
  if(last){T.phase='done';logCook();saveT();alarmOn();unwake();notify('Cuisson terminée',T.name+' est prêt.','cook')}
  else{
    const nx=T.stages[T.i+1];T.i++;T.phase='heat';T.heatStart=Date.now();saveT();ding();vib();
    notify(cur.l+' terminé','Réglez le thermostat sur '+nx.temp+' °C pour '+nx.l+'.','cook');
  }
  S.sheet='cook';renderSheet();renderMain();renderMini();
}
function stopT(){T=null;saveT();alarmOff();unwake();S.sheet=null;renderSheet();renderMain();renderNav()}
function tickT(){
  if(T.phase==='heat'){const e=(Date.now()-T.heatStart)/1000;document.querySelectorAll('.h-el').forEach(x=>x.textContent=fmt(e));return}
  const r=remaining();
  if(T.phase==='run'&&!T.paused&&r<=0){stageEnd();return}
  document.querySelectorAll('.t-rem').forEach(e=>e.textContent=fmt(r));
  const rp=$('#ringp');if(rp&&T.total&&T.phase==='run')rp.style.strokeDashoffset=(+rp.dataset.c||C1)*(1-r/T.total);
}

}
function prepSheet(){
  const {it}=S.P;

function prepDyn(){

/* ---------- Thermostat réglable (avant cuisson) ---------- */
let DRG=null;
function adjCtx(){
  if(S.sheet==='prep'&&S.P)return{kind:'prep',i:Math.min(S.pi||0,S.P.it.stages.length-1)};
  if(S.sheet==='cook'&&T&&T.phase==='heat'&&T.stages[T.i].temp)return{kind:'heat',i:T.i};
  return null;
}
const adjTemp=c=>c.kind==='prep'?S.P.temps[c.i]:T.stages[c.i].temp;
const adjSec=c=>c.kind==='prep'?S.P.secs[c.i]:T.stages[c.i].sec;
function recHtml(c){
  const it=c.kind==='prep'?S.P.it:ITEMS.find(x=>x.id===T.itemId);
  if(!it||!it.stages[c.i])return '';
  const rs=it.stages[c.i],t=adjTemp(c),s=adjSec(c),out=t<rs.t[0]||t>rs.t[1]||s<rs.m[0]*60||s>rs.m[1]*60;
  return `Recommandé · ${tfmt(rs.t)} · ${mfmt(rs.m)}`+(out?` <b style="color:var(--mid);font-weight:600">· hors plage</b>`:'');
}
function adjPaint(c,smooth){
  const t=adjTemp(c),s=adjSec(c),kn=document.querySelector('.dial.drag .kn');
  if(kn){if(smooth){kn.style.transition='transform .35s cubic-bezier(.3,.7,.2,1)';clearTimeout(adjPaint.h);adjPaint.h=setTimeout(()=>{kn.style.transition=''},420)}
    kn.style.transform='rotate('+KA(t).toFixed(1)+'deg)'}
  const arc=document.querySelector('.dial.drag .act');if(arc)arc.setAttribute('d',arcP(KA(150),KA(t),69));
  document.querySelectorAll('.adj-t').forEach(e=>e.textContent=t+' °C');
  document.querySelectorAll('.adj-d,.dial.drag .dur').forEach(e=>e.textContent=fmt(s));
  document.querySelectorAll('.dial.drag .ct').forEach(e=>e.textContent=t+' °C');
  setBg();
  const g=document.querySelector('.grab');if(g){g.setAttribute('aria-valuenow',t);g.setAttribute('aria-valuetext',t+' °C')}
  const rc=$('#rec');if(rc)rc.innerHTML=recHtml(c);
  if(c.kind==='prep'){const f=$('#foot');if(f)f.innerHTML=prepFoot()}
  else{const b=$('#readyb');if(b)b.textContent='Huile prête : lancer '+fmt(s)}
}
function adjSetTemp(c,t,smooth){
  t=Math.max(150,Math.min(190,Math.round(t/5)*5));
  if(c.kind==='prep')S.P.temps[c.i]=t;else{T.stages[c.i].temp=t;saveT()}
  adjPaint(c,smooth);
}
function adjSetSec(c,v){
  v=Math.max(15,Math.min(3600,v));
  if(c.kind==='prep')S.P.secs[c.i]=v;else{const st=T.stages[c.i];st.sec=v;T.total=v;T.rem=v;saveT()}
  adjPaint(c);
}
function adjKnob(c){
  const heat=c.kind==='heat',t=adjTemp(c),s=adjSec(c),stages=heat?T.stages:S.P.it.stages,n=stages.length;
  const lab=n>1?`${stages[c.i].l} · ${c.i+1}/${n}`:'Durée';
  return knob(t,heat,heat,{spin:heat,center:ctr(lab,fmt(s),'dur',t+' °C',19)})+
   `<div class="grab" role="slider" tabindex="0" aria-label="Température du thermostat" aria-valuemin="150" aria-valuemax="190" aria-valuenow="${t}" aria-valuetext="${t} °C"></div>`;
}
function adjCtl(c){
  return `<div class="adj"><div><div class="lbl">Température</div><div class="stp"><button data-act="atm" aria-label="Baisser la température de 5 degrés">${ui('minus',18)}</button><span class="adj-t">${adjTemp(c)} °C</span><button data-act="atp" aria-label="Augmenter la température de 5 degrés">${ui('plus',18)}</button></div></div>
   <div><div class="lbl">Durée</div><div class="stp"><button data-act="adm" aria-label="Réduire la durée de 15 secondes">${ui('minus',18)}</button><span class="adj-d">${fmt(adjSec(c))}</span><button data-act="adp" aria-label="Allonger la durée de 15 secondes">${ui('plus',18)}</button></div></div></div>`;
}
function dragMove(e){
  const dx=e.clientX-DRG.cx,dy=e.clientY-DRG.cy;if(Math.hypot(dx,dy)<14)return;
  const b=Math.atan2(dx,-dy)*180/Math.PI;
  adjSetTemp(DRG.c,b<-135?150:b>135?190:150+(b+135)/6.75);
}
function endDrag(){if(DRG){if(DRG.kn)DRG.kn.style.transition='';DRG=null}}
document.addEventListener('pointerdown',e=>{
  const g=e.target.closest&&e.target.closest('.grab');if(!g)return;
  const c=adjCtx();if(!c)return;
  const d=g.closest('.dial'),r=d.getBoundingClientRect();
  DRG={c,cx:r.left+r.width/2,cy:r.top+r.height/2,kn:d.querySelector('.kn')};
  if(DRG.kn)DRG.kn.style.transition='none';
  try{g.setPointerCapture(e.pointerId)}catch(_){}
  e.preventDefault();dragMove(e);
});
document.addEventListener('pointermove',e=>{if(DRG)dragMove(e)});
document.addEventListener('pointerup',endDrag);
document.addEventListener('pointercancel',endDrag);
let SWP=null;
document.addEventListener('pointerdown',e=>{
  if(DRG||!S.sheet||!e.target.closest)return;
  const inBar=e.target.closest('#sheet .sbar'),edge=e.target.id==='edge';
  if(!inBar&&!edge)return;
  SWP={x:e.clientX,y:e.clientY,t:performance.now(),mode:edge?'right':null,id:e.pointerId,d:0};
});
document.addEventListener('pointermove',e=>{
  if(!SWP||e.pointerId!==SWP.id)return;
  const dx=e.clientX-SWP.x,dy=e.clientY-SWP.y,sh=$('#sheet');
  if(!SWP.mode){if(Math.abs(dy)>8&&Math.abs(dy)>Math.abs(dx))SWP.mode='down';else return}
  SWP.d=SWP.mode==='down'?dy:dx;
  sh.style.transition='none';
  sh.style.transform=SWP.mode==='down'?'translateY('+Math.max(0,dy)+'px)':'translateX('+Math.max(0,dx)+'px)';
});
function endSwipe(){
  if(!SWP)return;const w=SWP;SWP=null;const sh=$('#sheet');
  if(!w.mode||w.d<=0){sh.style.transition='';sh.style.transform='';return}
  const v=w.d/Math.max(1,performance.now()-w.t);
  if(w.d>110||v>.6){
    sh.style.transition='transform .3s cubic-bezier(.32,.72,0,1)';
    sh.style.transform=w.mode==='down'?'translateY(100%)':'translateX(100%)';
    setTimeout(()=>{sh.style.transition='';sh.style.transform='';S.sheet=null;renderSheet();renderMain()},290);
  }else{
    sh.style.transition='transform .35s cubic-bezier(.32,.72,0,1)';sh.style.transform='';
    setTimeout(()=>{sh.style.transition=''},360);
  }
}
document.addEventListener('pointerup',endSwipe);document.addEventListener('pointercancel',endSwipe);
/* ---------- Écran de cuisson ---------- */
function cookSheet(){
  const st=T.stages[T.i],r=remaining(),ph=T.phase,n=T.stages.length,multi=n>1,tp=st.temp;
  const lab=multi?`${st.l} · ${T.i+1}/${n}`:'restantes';
  const pauseRow=`<div class="row3"><button class="sec" data-act="${T.paused?'resume':'pause'}">${ui(T.paused?'play':'pause',18)}${T.paused?'Reprendre':'Pause'}</button><button class="sec" data-act="plus1">${ui('plus',18)}1 min</button><button class="sec" data-act="stop">${ui('stop',18)}Arrêter</button></div>`;
  let body='',foot='';
  if(tp){
    if(ph==='heat'){
      const el=(Date.now()-T.heatStart)/1000,prev=T.i>0?T.stages[T.i-1]:null,c={kind:'heat',i:T.i};
      body=`${prev?`<div class="info" style="margin:0 0 8px">${prev.l} terminé : sortez et égouttez le panier.</div>`:''}
       <div class="dial big drag">${adjKnob(c)}</div>
       <div class="heatst" style="margin-top:12px"><i class="hl"></i><span>Chauffe en cours</span><b class="h-el">${fmt(el)}</b></div>
       <p class="sub" id="rec" style="text-align:center;margin:8px 0 14px">${recHtml(c)}</p>${adjCtl(c)}`;
      foot=`<div class="frow"><button class="go" id="readyb" data-act="ready" style="font-size:15px">Huile prête : lancer ${fmt(st.sec)}</button><button class="ib2" data-act="stop" aria-label="Arrêter">${ui('stop',20)}</button></div>`;
    }else if(ph==='run'){
      body=`<div class="dial big">${knob(tp,false,false,{frac:r/T.total,center:ctr(T.paused?'En pause':lab,fmt(r),'t-rem',tp+' °C')})}</div>
       <div class="grp" style="margin-top:16px"><div class="lr"><span>Fin prévue</span><b>${T.paused?'En pause':new Date(T.end).toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'})}</b></div>${multi?`<div class="lr"><span>Étape</span><b>${st.l} · ${T.i+1} sur ${n}</b></div>`:''}${T.qty?`<div class="lr"><span>Quantité</span><b>${gfmt(T.qty)}</b></div>`:''}</div>`;
      foot=pauseRow;
    }else{
      body=`<div class="dial big">${knob(tp,false,false,{frac:1,col:'#FF9F4A',center:ctr('Cuisson','Prêt !','',null,17)})}</div>
       ${T.kind==='cook'?`<p class="sub" style="text-align:center;margin:8px 0 0">Comptez cette cuisson pour suivre l’usure de l’huile.</p>`:''}`;
      foot=T.kind==='cook'?`<button class="go" data-act="dcount">${ui('drop',20)}Compter la cuisson + rappel filtrage</button><button class="sec" data-act="stop">Terminer sans compter</button>`:`<button class="go" data-act="stop">Terminer</button>`;
    }
  }else{
    const dn=ph==='done',off=dn?0:C1*(1-r/T.total);
    body=`<div style="text-align:center">${svg(T.icon,56)}<h1 style="margin:6px 0 8px;font-size:22px">${esc(T.name)}</h1></div>
     <div class="ring ${dn?'dn':''}"><svg viewBox="0 0 260 260"><circle class="tr" cx="130" cy="130" r="118"/><circle class="pg" id="ringp" cx="130" cy="130" r="118" stroke-dasharray="${C1}" style="stroke-dashoffset:${off}"/></svg><div class="rc">${dn?'<div class="big" style="font-size:40px">C’est prêt</div>':`<div class="big t-rem">${fmt(r)}</div><div class="sm">${T.paused?'En pause':'restantes'}</div>`}</div></div>`;
    foot=dn?`<button class="go" data-act="stop">Terminer</button>`:pauseRow;
  }
  return `<div class="sbar"><button class="ib" data-act="back" aria-label="Réduire">${ui('back',20)}</button><div class="st">${esc(T.name)}</div><span style="width:40px"></span></div>
  <div class="sbody">${body}</div><div class="sfoot">${foot}</div>`;
}
let lastSheet=null;
function renderSheet(){
  const sh=$('#sheet');
  if(!S.sheet||(S.sheet==='cook'&&!T)||(S.sheet==='prep'&&!S.P)){S.sheet=null;sh.hidden=true;sh.innerHTML='';lastSheet=null;setBg();renderMini();return}
  setBg();
  const old=sh.querySelector('.sbody'),st=(old&&lastSheet===S.sheet)?old.scrollTop:0;
  const was=sh.hidden;sh.hidden=false;sh.dataset.ph=(S.sheet==='cook'&&T)?T.phase:'';
  if(was){sh.classList.remove('in');void sh.offsetWidth;sh.classList.add('in')}
  sh.innerHTML=S.sheet==='prep'?prepSheet():cookSheet();
  if(S.sheet==='prep')prepUpdate();
  animKnobs();
  const nb=sh.querySelector('.sbody');if(nb)nb.scrollTop=st;
  lastSheet=S.sheet;renderMini();
}

async function doInstall(){
  if(DIP){DIP.prompt();try{await DIP.userChoice}catch(e){}DIP=null;renderMain()}
  else showInstall();
}
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();DIP=e});
window.addEventListener('appinstalled',()=>{DIP=null;renderMain();toast('Application installée.')});

/* ---------- Réglages : préférences, historique, sauvegarde ---------- */
const VER='12';
const THEMES=[['auto','Auto','linear-gradient(90deg,#F2F2F7 50%,#000 50%)','#8a8a90','#c9c9d0'],['light','Clair','#F2F2F7','#2a2a30','#FFFFFF'],['sand','Sable','#F6F1E7','#4a3d28','#FFFDF8'],['graphite','Graphite','#16181D','#c8cdd8','#2B2F37'],['dark','Sombre','#000000','#cfcfd4','#1C1C1E']];
const ACCENTS=[['green','Émeraude','#30D158'],['blue','Océan','#4DA3FF'],['purple','Violet','#BF5AF2'],['pink','Rose','#FF4F7B'],['teal','Turquoise','#40C8E0']];
function logCook(){
  if(!T||T.kind!=='cook'||T.logged)return;
  T.logged=true;saveT();
  D.hist=D.hist||[];
  D.hist.unshift({id:T.itemId,name:T.name,tag:T.tag||'',temps:T.stages.map(s=>s.temp),secs:T.stages.map(s=>s.sec),qty:T.qty||0,ts:Date.now()});
  D.hist=D.hist.slice(0,60);save();
}
function viewSettings(){
  const o=D.oil,h=D.hist||[],now=Date.now(),wk=h.filter(x=>now-x.ts<7*864e5).length;
  const sw=(k,label,sub)=>`<div class="lr"><div><span>${label}</span>${sub?`<small>${sub}</small>`:''}</div><button class="sw" role="switch" aria-checked="${!!PF[k]}" aria-label="${label}" data-act="tgl" data-v="${k}"></button></div>`;
  const np='Notification' in window?Notification.permission:'none';
  const notif=np==='granted'?'<b>Activées</b>':np==='denied'?'<b>Refusées</b>':np==='none'?'<b>Indisponibles</b>':`<button class="lnk" data-act="notif">Activer</button>`;
  const hist=h.slice(0,8).map(x=>`<div class="lr"><div><span>${esc(x.name)}</span><small>${esc(x.tag||'')}${x.tag?' · ':''}${x.temps.map(t=>t+' °C').join(' → ')} · ${fmt(x.secs.reduce((a,b)=>a+b,0))}${x.qty?' · '+gfmt(x.qty):''}</small></div><b>${dfmt(x.ts)}</b></div>`).join('');
  return `<div class="wrap">${head('Réglages','Apparence, cuisson et données')}
   <h3 class="sh2">Apparence</h3>
   <div class="grp pad"><div class="thm">${THEMES.map(([id,n,bg,tx,cd])=>`<button class="${theme===id?'on':''}" data-act="setTheme" data-v="${id}" aria-label="Thème ${n}"><div class="pv" style="background:${bg}"><b style="background:${tx}"></b><i style="background:${cd}"></i><i style="background:${cd}"></i></div>${n}</button>`).join('')}</div>
    <div class="lbl" style="margin:18px 0 10px">Couleur</div>
    <div class="acc">${ACCENTS.map(([id,n,c])=>`<button class="${accent===id?'on':''}" style="background:${c}" data-act="setAccent" data-v="${id}" aria-label="${n}"></button>`).join('')}</div>
    <div class="lbl" style="margin:18px 0 8px">Verre</div>
    <div class="seg" style="margin:0">${[['clear','Clair'],['standard','Standard'],['tinted','Teinté']].map(([v,l])=>`<button class="${glass===v?'on':''}" data-act="setGlass" data-v="${v}">${l}</button>`).join('')}</div></div>
   <div class="grp" style="margin-top:12px">${sw('bg','Fond animé','Halos de couleur derrière l’interface')}</div>
   <h3 class="sh2">Cuisson</h3>
   <div class="grp">${sw('wake','Écran allumé','Pendant une cuisson')}${sw('sound','Son de fin','Un « ding » à la fin du minuteur')}
    ${PF.sound?`<div class="lr"><span>Volume</span><input type="range" id="vol" min="0" max="100" value="${Math.round(PF.vol*100)}" style="--p:${Math.round(PF.vol*100)}%;width:150px;margin:0"></div><button class="lr act" data-act="testsnd">Tester le son</button>`:''}
    ${sw('vib','Vibration','Selon l’appareil')}
    <div class="lr"><span>Notifications</span>${notif}</div></div>
   <h3 class="sh2">Huile</h3>
   <div class="grp"><div class="lr"><span>Remplacer après</span><div class="stp"><button data-act="lm" aria-label="Moins">${ui('minus',18)}</button><span>${o.limit}</span><button data-act="lp" aria-label="Plus">${ui('plus',18)}</button></div></div>
    <div class="lr"><span>Rappel de filtrage</span><div class="seg" style="margin:0;width:150px">${[2,3,4].map(x=>`<button class="${o.delay===x?'on':''}" data-act="fdelay" data-v="${x}">${x} h</button>`).join('')}</div></div></div>
   <h3 class="sh2">Historique</h3>
   <div class="grp"><div class="lr"><span>Cuissons enregistrées</span><b>${h.length}</b></div><div class="lr"><span>Sur 7 jours</span><b>${wk}</b></div>${hist}
    ${h.length?`<button class="lr act red" data-act="clrhist">Effacer l’historique</button>`:`<div class="lr"><small style="margin:0">Les cuissons terminées apparaissent ici.</small></div>`}</div>
   <h3 class="sh2">Données</h3>
   <div class="grp"><button class="lr act" data-act="exp">Exporter mes données</button><button class="lr act" data-act="imp">Importer une sauvegarde</button><button class="lr act red" data-act="rst">${S.confirmAll?'Confirmer : tout effacer':'Tout réinitialiser'}</button></div>
   <h3 class="sh2">Conseils de sécurité</h3>
   <div class="grp pad tips"><p>Ne dépassez jamais le repère MAX d’huile ni la capacité du panier.</p><p>Séchez bien les aliments : l’eau fait éclabousser l’huile.</p><p>Ne laissez pas la friteuse sans surveillance pendant la chauffe.</p><p>Laissez l’huile refroidir avant de filtrer ou de déplacer l’appareil.</p><p>Gardez le couvercle fermé pendant la cuisson et ouvrez-le loin du visage.</p></div>
   <h3 class="sh2">À propos</h3>
   <div class="grp"><div class="lr"><span>Friteuse Oleoclean</span><b>Version ${VER}</b></div><div class="lr"><small style="margin:0">Guide indicatif : suivez toujours la notice de votre appareil.</small></div></div></div>`;
}
function exportJSON(){return JSON.stringify({app:'oleoclean',v:VER,state:D,prefs:PF,theme,accent,glass},null,1)}
function showExport(){
  const m=$('#modal');m.hidden=false;
  m.innerHTML=`<div class="mdl" role="dialog" aria-modal="true" aria-label="Exporter"><h2>Exporter mes données</h2><p>Copiez ce texte et conservez-le : vous pourrez le coller dans « Importer une sauvegarde ».</p><textarea class="ta" id="expta" readonly>${esc(exportJSON())}</textarea><div class="row" style="margin-top:12px"><button class="sec" data-act="expcopy">Copier</button><button class="sec" data-act="expdl">Télécharger</button></div><button class="txt" data-act="mclose">Fermer</button></div>`;
}
function showImport(){
  const m=$('#modal');m.hidden=false;
  m.innerHTML=`<div class="mdl" role="dialog" aria-modal="true" aria-label="Importer"><h2>Importer une sauvegarde</h2><p>Collez ici le texte d’une sauvegarde. Vos données actuelles seront remplacées.</p><textarea class="ta" id="impta" placeholder="Collez la sauvegarde ici"></textarea><button class="go" data-act="impgo" style="margin-top:12px">Restaurer</button><button class="txt" data-act="mclose">Annuler</button></div>`;
}
function doImport(txt){
  try{
    const o=JSON.parse(txt);if(!o||o.app!=='oleoclean')throw 0;
    if(o.state)LS.s('ole_state',o.state);if(o.prefs)LS.s('ole_prefs',o.prefs);if(o.theme)LS.s('ole_theme',o.theme);if(o.accent)LS.s('ole_accent',o.accent);if(o.glass)LS.s('ole_glass',o.glass);
    location.reload();
  }catch(e){toast('Sauvegarde invalide.')}
}
function resetAll(){try{Object.keys(localStorage).filter(k=>k.startsWith('ole_')).forEach(k=>localStorage.removeItem(k))}catch(e){}location.reload()}
/* ---------- Actions ---------- */
document.addEventListener('click',e=>{
  if(e.target.id==='modal'){$('#modal').hidden=true;return}
  const el=e.target.closest('[data-act]');if(!el)return;
  const a=el.dataset.act,v=el.dataset.v,i=+el.dataset.i,P=S.P;
  switch(a){
  case 'tab':S.tab=v;S.confirmReset=false;renderNav();renderMain();window.scrollTo(0,0);break;
  case 'filter':S.filter=v;renderMain();break;
  case 'open':openItem(el.dataset.id);break;
  case 'openCook':S.sheet='cook';renderSheet();break;
  case 'back':S.sheet=null;renderSheet();renderMain();break;
  case 'setTheme':theme=v;LS.s('ole_theme',theme);applyTheme();renderMain();break;
  case 'setGlass':glass=v;LS.s('ole_glass',glass);applyDisplay();renderMain();break;
  case 'install':doInstall();break;
  case 'setAccent':accent=v;LS.s('ole_accent',accent);applyTheme();renderMain();break;
  case 'tgl':PF[v]=!PF[v];savePF();applyDisplay();if(v==='sound'&&PF.sound)unlock();renderMain();break;
  case 'testsnd':unlock();ding();break;
  case 'notif':try{Notification.requestPermission().then(()=>renderMain())}catch(e){}break;
  case 'clrhist':D.hist=[];save();renderMain();break;
  case 'exp':showExport();break;
  case 'expcopy':{const t=$('#expta');t.select();let ok=false;try{ok=document.execCommand('copy')}catch(_){}if(!ok&&navigator.clipboard)navigator.clipboard.writeText(t.value).catch(()=>{});toast('Copié.')}break;
  case 'expdl':try{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([exportJSON()],{type:'application/json'}));a.download='oleoclean-sauvegarde.json';document.body.appendChild(a);a.click();a.remove()}catch(_){}break;
  case 'imp':showImport();break;
  case 'impgo':doImport($('#impta').value);break;
  case 'rst':if(S.confirmAll)resetAll();else{S.confirmAll=true;renderMain();clearTimeout(S.cat2);S.cat2=setTimeout(()=>{S.confirmAll=false;if(S.tab==='set')renderMain()},4000)}break;
  case 'reopen':{const h=(D.hist||[])[+v];if(h)openItem(h.id,h)}break;
  case 'mclose':$('#modal').hidden=true;break;
  case 'qm':setQty(P.qty-50);break;
  case 'qp':setQty(P.qty+50);break;
  case 'qset':setQty(+v);break;
  case 'clamp':setQty(maxOf(P.it));break;
  case 'atm':{const c=adjCtx();if(c)adjSetTemp(c,adjTemp(c)-5,true)}break;
  case 'atp':{const c=adjCtx();if(c)adjSetTemp(c,adjTemp(c)+5,true)}break;
  case 'adm':{const c=adjCtx();if(c)adjSetSec(c,adjSec(c)-15)}break;
  case 'adp':{const c=adjCtx();if(c)adjSetSec(c,adjSec(c)+15)}break;
  case 'pstage':S.pi=+v;prepUpdate();break;
  case 'stemp':P.temps[i]=+v;prepUpdate();break;
  case 'tmm':P.secs[i]=Math.max(15,P.secs[i]-15);prepUpdate();break;
  case 'tmp':P.secs[i]=Math.min(3600,P.secs[i]+15);prepUpdate();break;
  case 'start':
    if(P.qty>maxOf(P.it))break;
    startT({kind:'cook',frac:Math.min(1,P.qty/maxOf(P.it)),itemId:P.it.id,name:P.it.name,tag:TAGS[P.it.tag],icon:P.it.icon,qty:P.qty,stages:P.it.stages.map((s,k)=>({l:s.l,temp:P.temps[k],sec:P.secs[k]}))});break;
  case 'ready':unlock();alarmOff();beginStage();saveT();wake();renderSheet();break;
  case 'pause':T.rem=remaining();T.paused=true;saveT();unwake();renderSheet();break;
  case 'resume':T.end=Date.now()+T.rem*1000;T.paused=false;saveT();wake();renderSheet();break;
  case 'plus1':if(T.paused)T.rem+=60;else T.end+=60000;T.total+=60;saveT();renderSheet();break;
  case 'stop':stopT();break;
  case 'dcount':
    if(!T.counted){addCycle();T.counted=true}
    startFilter(D.oil.delay);stopT();S.tab='oil';renderNav();renderMain();toast('Cuisson comptée, rappel de filtrage lancé.');break;
  case 'mode':S.mode=v;renderMain();break;
  case 'cadj':S.cust=Math.max(0,Math.min(5999,S.cust+(+v)));renderMain();break;
  case 'cset':S.cust=+v;renderMain();break;
  case 'cstart':if(S.cust>0)startT({kind:'custom',name:'Minuteur '+fmt(S.cust).replace(/^0/,''),icon:'clock',stages:[{l:'Minuteur',temp:null,sec:S.cust}]});break;
  case 'chgo':unlock();if(CH.run){CH.acc+=Date.now()-CH.t0;CH.run=false}else{CH.t0=Date.now();CH.run=true}renderMain();break;
  case 'chlap':CH.laps.unshift(chMs());renderMain();break;
  case 'chrs':CH.run=false;CH.acc=0;CH.laps=[];renderMain();break;
  case 'oadd':addCycle();renderNav();renderMain();break;
  case 'osub':D.oil.count=Math.max(0,D.oil.count-1);save();renderMain();break;
  case 'lm':D.oil.limit=Math.max(8,D.oil.limit-1);save();renderMain();break;
  case 'lp':D.oil.limit=Math.min(12,D.oil.limit+1);save();renderMain();break;
  case 'ochange':
    if(S.confirmReset){D.oil.count=0;D.oil.lastChange=Date.now();save();S.confirmReset=false;renderMain();toast('Compteur remis à zéro.')}
    else{S.confirmReset=true;renderMain();clearTimeout(S.ct);S.ct=setTimeout(()=>{S.confirmReset=false;if(S.tab==='oil')renderMain()},4000)}break;
  case 'fdelay':D.oil.delay=+v;save();renderMain();break;
  case 'fstart':startFilter(D.oil.delay);renderNav();renderMain();break;
  case 'fdone':filterDone();renderNav();renderMain();toast('Filtrage enregistré.');break;
  case 'fcancel':filterCancel();renderNav();renderMain();break;
  case 'ics':icsDownload();break;
  }
});
document.addEventListener('input',e=>{if(e.target.id==='qr'&&S.P)setQty(+e.target.value);if(e.target.id==='vol'){PF.vol=e.target.value/100;savePF();e.target.style.setProperty('--p',e.target.value+'%')}});
document.addEventListener('keydown',e=>{
  if((e.key==='Enter'||e.key===' ')&&e.target.matches('[role=button]')){e.preventDefault();e.target.click()}
  if(e.key==='Escape'&&!$('#modal').hidden)$('#modal').hidden=true;
  if(e.target.classList&&e.target.classList.contains('grab')){const c=adjCtx();if(c){if(e.key==='ArrowUp'||e.key==='ArrowRight'){adjSetTemp(c,adjTemp(c)+5,true);e.preventDefault()}else if(e.key==='ArrowDown'||e.key==='ArrowLeft'){adjSetTemp(c,adjTemp(c)-5,true);e.preventDefault()}}}
});
document.addEventListener('visibilitychange',()=>{document.body.classList.toggle('hid',document.hidden);if(!document.hidden){wake();renderNav()}});
window.addEventListener('scroll',()=>document.body.classList.toggle('sc',window.scrollY>44),{passive:true});

/* ---------- Verrouillage du zoom et de la sélection ---------- */
['gesturestart','gesturechange','gestureend'].forEach(t=>document.addEventListener(t,e=>e.preventDefault()));
document.addEventListener('touchmove',e=>{if(e.touches&&e.touches.length>1)e.preventDefault()},{passive:false});
let lastTap=0;
document.addEventListener('touchend',e=>{const n=Date.now();if(n-lastTap<320&&!(e.target.closest&&e.target.closest('input,textarea')))e.preventDefault();lastTap=n},{passive:false});
window.addEventListener('wheel',e=>{if(e.ctrlKey)e.preventDefault()},{passive:false});
window.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&['+','-','=','0'].includes(e.key))e.preventDefault()});
document.addEventListener('selectstart',e=>{if(!(e.target.closest&&e.target.closest('input,textarea'))&&!(e.target.nodeType===1?false:(e.target.parentElement&&e.target.parentElement.closest('input,textarea'))))e.preventDefault()});
document.addEventListener('dragstart',e=>e.preventDefault());

/* ---------- Boucle principale ---------- */
setInterval(()=>{
  if(T)tickT();
  tickF();
  if(CH.run){const c=$('#chv');if(c)c.textContent=chFmt(chMs());const g=$('#chp');if(g)g.style.transform='rotate('+((chMs()/60000*360)%360).toFixed(1)+'deg)'}
},100);
